name: fitness_app
description: "PulseFit AI — Local-first responsive workout tracking and two-stage RAG recommendation engine."
publish_to: 'none'
homepage: "https://joelaah.github.io/fitness_app/"
repository: "https://github.com/joelaah/fitness_app"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7
  provider: ^6.1.5+1
  uuid: ^4.6.0
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.2
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  fl_chart: ^0.68.0
  http: ^1.2.0
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  very_good_analysis: ^9.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/data/exercises.json
    - assets/images/
    - assets/images/covers/
    - assets/videos/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#121212"
  image: "assets/images/app_icon.png"
  android: true
  ios: true
