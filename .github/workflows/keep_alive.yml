name: Keep Render Backend Warm

on:
  schedule:
    # Run every 12 minutes to keep the Render.com free-tier instance alive (sleep threshold is 15m)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-render:
    name: Ping PulseFit RAG Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health Endpoint
        run: |
          echo "Pinging PulseFit AI RAG backend to maintain warm container..."
          
          # Render free tier takes 30-60s to wake up if cold.
          # Allow up to 90s and protect against curl non-zero exit codes (e.g. exit code 28 on timeout).
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 20 --max-time 90 "https://fitness-rag-api.onrender.com/health" || echo "000")
          echo "Initial HTTP status: $STATUS"
          
          if [ "$STATUS" = "200" ]; then
            echo "Render backend is alive, warm, and returned 200 OK."
          elif [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ] 2>/dev/null; then
            echo "Render backend responded with status: $STATUS"
          else
            echo "Instance was cold or spin-up in progress (status: $STATUS). Wake-up signal transmitted."
            echo "Waiting 15 seconds before secondary verification ping..."
            sleep 15
            RETRY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 20 --max-time 60 "https://fitness-rag-api.onrender.com/health" || echo "000")
            echo "Secondary HTTP status: $RETRY_STATUS"
          fi

          # Always exit 0: The purpose of this scheduled task is to emit keep-alive traffic,
          # not to fail CI builds or trigger GitHub error notification emails.
          echo "Keep-alive routine completed successfully."
          exit 0

